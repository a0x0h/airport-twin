name: Bug report
description: Something in the twin or the Lab is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open #/hall
        2. Set speed to 300×
        3. ...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route, design and seed
      placeholder: "#/hall · MHD proposed · seed 42"
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on Windows 11
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console output
